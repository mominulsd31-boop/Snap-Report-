<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="/style.css"></head><body class="bg"><main class="login-card"><h1>WORKER REPORT</h1><p class="muted">Login to continue</p><form id="login"><input id="username" placeholder="Username" required><input id="password" type="password" placeholder="Password" required><button>LOGIN</button><div id="msg"></div></form></main><script>
document.querySelector("#login").onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:username.value,password:password.value})});let d=await r.json();if(r.ok)location.href=d.role==="admin"?"/admin.html":"/worker.html";else msg.textContent=d.error};
</script></body></html>
